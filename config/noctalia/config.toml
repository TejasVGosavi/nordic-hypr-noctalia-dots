[accessibility]
high_contrast = false
ui_scale = 1.0

[audio]
enable_notification_sounds = true
enable_overdrive = true
enable_power_sounds = true
enable_screenshot_sounds = true
enable_sounds = true
enable_volume_sounds = true
sound_theme = "freedesktop"
sound_volume = 0.5

[backdrop]
blur_intensity = 0.65
enabled = true
tint_intensity = 0.25

[bar]
order = [ "default" ]

    [bar.default]
    auto_hide = false
    auto_hide_delay_ms = 0
    background_opacity = 0.72
    border = "outline_variant"
    border_width = 1.0
    capsule = true
    capsule_border_width = 1.0
    capsule_fill = "surface_container"
    capsule_group = []
    capsule_opacity = 0.88
    capsule_padding = 8.0
    capsule_thickness = 0.78
    center = [ "cpu", "gpu", "ram", "disk" ]
    compositor_blur = true
    concave_edge_corners = false
    contact_shadow = false
    enabled = true
    end = [
        "media",
        "audio_visualizer",
        "wallhaven",
        "mpvpaper",
        "arch_updater",
        "localsend",
        "keybinds_help",
        "volume",
        "brightness",
        "clock",
        "tray",
        "control-center"
    ]
    font_scale = 1.0
    font_weight = 500
    hover_highlight = true
    layer = "top"
    margin_edge = 8
    margin_ends = 12
    margin_opposite_edge = 0
    padding = 8
    panel_overlap = 1
    position = "top"
    radius = 16
    radius_bottom_left = 16
    radius_bottom_right = 16
    radius_top_left = 16
    radius_top_right = 16
    reserve_space = true
    scale = 1.0
    shadow = true
    show_on_workspace_switch = true
    show_tooltip = true
    smart_auto_hide = false
    start = [ "launcher", "workspaces", "active_window", "bongocat" ]
    thickness = 38
    widget_spacing = 6

[battery]
warning_threshold = 10

[brightness]
enable_ddcutil = true
ignore_mmids = []
minimum_brightness = 0.0
sync_all_monitors = true

[calendar]
dedupe_events = true
dedupe_ignore_patterns = []
enabled = true
event_date_format = "%A %e %B"
event_time_format = "%H:%M"
refresh_minutes = 15

    [calendar.reminders]
    all_day_digest_time = "09:00"
    default_lead_minutes = 10
    enabled = true
    use_event_reminders = true

[control_center]
