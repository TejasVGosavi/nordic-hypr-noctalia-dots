    "mango",
    "niri",
    "qt",
    "scroll",
    "starship",
    "sway",
    "umbriel",
    "wezterm"
]
enable_builtin_templates = true
enable_community_templates = true

[wallpaper]
directory = "/home/tejasvishwasgosavi/wallpaper"
