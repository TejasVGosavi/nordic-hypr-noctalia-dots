# =====================================================================
# ~ HYPRIDLE: ~/.config/hypr/hypridle.conf (Wired to Noctalia v5) ~
# =====================================================================

general {
    lock_cmd = noctalia msg lock
    before_sleep_cmd = noctalia msg lock
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 1. Dim monitor after 5 minutes (300s) of inactivity
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# 2. Lock session via Noctalia v5 after 10 minutes (600s)
listener {
    timeout = 600
    on-timeout = noctalia msg lock
}

# 3. Turn off display (DPMS off) after 15 minutes (900s)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}